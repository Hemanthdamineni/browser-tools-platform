name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install reference tools for the golden tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip qpdf poppler-utils ffmpeg
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tool docs are current
        run: npm run docs:check
      - name: Unit tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke + privacy (no network egress) e2e
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Full-catalogue runtime audit — clicks every example and runs every file
  # tool. Sharded 4 ways so the whole catalogue finishes in a few minutes.
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deep runtime audit (shard ${{ matrix.shard }}/4)
        run: AUDIT_SHARDS=4 AUDIT_SHARD=$(( ${{ matrix.shard }} - 1 )) npm run test:audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deep-audit-report
          path: test-results/deep-audit-report.jsonl
          retention-days: 7
